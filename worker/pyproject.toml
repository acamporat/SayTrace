[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "local-transcript-worker"
version = "0.1.0"
description = "Offline ML sidecar for SayTrace"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
authors = [{ name = "acamporat" }]
dependencies = []

[project.optional-dependencies]
ml = [
  "faster-whisper==1.2.1",
  "huggingface-hub==0.36.2",
  "numpy==2.5.1",
  "pyannote.audio==4.0.7",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchcodec==0.7.0",
  "torchvision==0.23.0",
  "whisperx==3.8.6",
]
setup = [
  "huggingface-hub==0.36.2",
]

[project.scripts]
local-transcript-worker = "local_transcript_worker.__main__:main"

[dependency-groups]
build = ["pyinstaller==6.21.0"]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/local_transcript_worker"]

[tool.hatch.build.targets.wheel.force-include]
"model-manifest.json" = "local_transcript_worker/model-manifest.json"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
packages = ["local_transcript_worker"]

[[tool.mypy.overrides]]
module = [
  "ctranslate2",
  "faster_whisper",
  "huggingface_hub",
  "numpy",
  "nltk.*",
  "pyannote.*",
  "torch",
  "whisperx",
]
ignore_missing_imports = true
