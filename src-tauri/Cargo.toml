[package]
name = "local-transcript"
version = "0.1.0"
description = "Private, offline-first meeting transcription for Windows"
authors = ["acamporat"]
license = "Apache-2.0"
repository = "https://github.com/acamporat/SayTrace"
edition = "2021"
rust-version = "1.88"

[lib]
name = "local_transcript_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "local-transcript"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
hex = "0.4.3"
hound = "3.5.1"
log = "0.4.27"
mime_guess = "2.0.5"
parking_lot = "0.12.4"
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.12"
uuid = { version = "1.18.0", features = ["serde", "v5", "v7"] }
zeroize = "1.8.1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.23.0"

[dev-dependencies]
tempfile = "3.20.0"
